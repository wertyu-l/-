<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLV 输入设备模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#7c4dff,#5e35b1);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:600}
.header .badge{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:13px}
.header-right{display:flex;align-items:center;gap:12px}
.refresh-indicator{font-size:12px;opacity:.8}
.container{max-width:1200px;margin:0 auto;padding:20px}
.panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:20px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee;background:#fafbfc}
.panel-header h2{font-size:16px;font-weight:600}
.panel-body{padding:20px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}
.btn-outline{background:#fff;color:#7c4dff;border:1px solid #7c4dff}
.btn-outline:hover{background:#f3efff}
.btn-sm{padding:4px 10px;font-size:12px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.info-item{display:flex;flex-direction:column;padding:10px 14px;background:#f8f9fa;border-radius:6px}
.info-label{font-size:12px;color:#888;margin-bottom:4px}
.info-value{font-size:14px;font-weight:500;word-break:break-all}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.online{background:#0f9d58}
.status-dot.offline{background:#d93025}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;background:#f8f9fa;font-size:12px;color:#888;border-bottom:2px solid #eee}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
.empty-state{text-align:center;padding:40px 20px;color:#999}
.kv-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kv-row .k{min-width:100px;font-size:14px;font-weight:500}
.kv-row .v{flex:1;font-family:monospace;font-size:13px;padding:6px 10px;background:#f8f9fa;border-radius:6px;word-break:break-all}
.toast{position:fixed;top:16px;right:16px;padding:12px 20px;border-radius:6px;color:#fff;font-size:14px;z-index:999;animation:slideIn .3s ease}
.toast-success{background:#0f9d58}
.toast-error{background:#d93025}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<div class="header">
  <h1 id="headerTitle">加载中...</h1>
  <span class="badge" id="headerBadge">加载中...</span>
</div>

<div class="container">

  <div class="panel">
    <div class="panel-header">
      <h2>设备信息</h2>
      <button class="btn btn-outline btn-sm" onclick="loadDeviceInfo()">刷新</button>
    </div>
    <div class="panel-body">
      <div class="info-grid" id="deviceInfo"><div class="empty-state">加载中...</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>设备能力</h2>
    </div>
    <div class="panel-body">
      <div class="info-grid" id="capability"><div class="empty-state">加载中...</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>通道播放地址</h2>
    </div>
    <div class="panel-body">
      <div id="channelUrlList"><div class="empty-state">加载中...</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>窗口列表（由管控系统推送）</h2>
      <button class="btn btn-outline btn-sm" onclick="loadWindows()">刷新</button>
    </div>
    <div class="panel-body">
      <table>
        <thead>
          <tr>
            <th>窗口ID</th>
            <th>通道名</th>
            <th>坐标 (x,y)</th>
            <th>尺寸 (w×h)</th>
            <th>信号类型</th>
            <th>信号地址</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody id="windowTableBody">
          <tr><td colspan="7" class="empty-state">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div id="toastContainer"></div>

<script>
var API_BASE = '';
var _capCache = {};
var _channelUrlsRendered = false;
var _lastChannelKeys = '';

function api(path, opts) {
  opts = opts || {};
  var init = { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json' } };
  if (opts.body) { init.body = JSON.stringify(opts.body); }
  return fetch(API_BASE + path, init).then(function(r) { return r.json(); });
}

function toast(msg, type) {
  type = type || 'success';
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 3000);
}

function loadDeviceInfo() {
  api('/simulator/device/info').then(function(res) {
    if (res.code !== 1) { document.getElementById('deviceInfo').innerHTML = '<div class="empty-state">加载失败</div>'; return; }
    var d = res.data;
    document.getElementById('headerTitle').textContent = d.deviceName;
    document.getElementById('headerBadge').textContent = '输入设备 · 端口 ' + (location.port || '');
    var chs = getInputChannels(d).filter(Boolean);
    document.getElementById('deviceInfo').innerHTML =
      it('设备名称', d.deviceName) + it('设备类型', d.deviceType) +
      it('设备类别', '输入设备（INPUT）') + it('型号', d.model) + it('序列号', d.serialNumber) +
      it('输入通道', chs.length ? chs.join(', ') : '无') +
      it('最大分辨率', d.maxResolution);
    loadCapability();
    loadWindows();
  }).catch(function() { document.getElementById('deviceInfo').innerHTML = '<div class="empty-state">加载失败</div>'; });
}

function getInputChannels(d) {
  var chs = [];
  for (var i = 1; i <= 5; i++) {
    var ch = d['inputChannel' + i];
    if (ch) chs.push(ch);
  }
  return chs;
}

function it(label, value) {
  return '<div class="info-item"><span class="info-label">' + esc(label) + '</span><span class="info-value">' + esc(value || '-') + '</span></div>';
}

function loadCapability() {
  api('/simulator/device/capability').then(function(res) {
    if (res.code !== 1) { document.getElementById('capability').innerHTML = '<div class="empty-state">加载失败</div>'; return; }
    _capCache = res.data || {};
    var c = _capCache;
    var chs = getInputChannels(c);
    document.getElementById('capability').innerHTML =
      it('最大分辨率', c.maxResolution) + it('通道数', c.channelCount) +
      it('输入通道', chs.length ? chs.join(', ') : '无');
    loadChannelUrls();
  }).catch(function() { document.getElementById('capability').innerHTML = '<div class="empty-state">加载失败</div>'; });
}

function loadChannelUrls() {
  api('/simulator/channel/urls').then(function(res) {
    if (res.code !== 1) { document.getElementById('channelUrlList').innerHTML = '<div class="empty-state">加载失败</div>'; return; }
    renderChannelUrls(res.data || {});
  }).catch(function() { document.getElementById('channelUrlList').innerHTML = '<div class="empty-state">加载失败</div>'; });
}

function renderChannelUrls(urls) {
  var chs = getChannelList();
  var chKeys = chs.join('|');
  if (chs.length === 0) {
    document.getElementById('channelUrlList').innerHTML = '<div class="empty-state">暂无通道</div>';
    _channelUrlsRendered = false;
    _lastChannelKeys = '';
    return;
  }
  if (_channelUrlsRendered && chKeys === _lastChannelKeys) {
    for (var i = 0; i < chs.length; i++) {
      var ch = chs[i];
      var safeId = 'cu_' + ch.replace(/[^a-zA-Z0-9_-]/g, '_');
      var input = document.getElementById(safeId);
      if (input && document.activeElement !== input) {
        var newVal = urls[ch] || '';
        if (input.value !== newVal) { input.value = newVal; }
      }
    }
    return;
  }
  var html = '';
  for (var i = 0; i < chs.length; i++) {
    var ch = chs[i];
    var val = urls[ch] || '';
    var safeId = 'cu_' + ch.replace(/[^a-zA-Z0-9_-]/g, '_');
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    html += '<span style="min-width:80px;font-size:14px;font-weight:500">' + esc(ch) + '</span>';
    html += '<input id="' + safeId + '" type="text" value="' + esc(val) + '" placeholder="输入视频/网页URL" style="flex:1;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px">';
    html += '<button class="btn btn-outline btn-sm" onclick="saveChannelUrl(\'' + esc(ch) + '\')">保存</button>';
    html += '</div>';
  }
  document.getElementById('channelUrlList').innerHTML = html;
  _channelUrlsRendered = true;
  _lastChannelKeys = chKeys;
}

function getChannelList() {
  var chs = [];
  for (var i = 1; i <= 5; i++) {
    var ch = _capCache['inputChannel' + i];
    if (ch) chs.push(ch);
  }
  return chs;
}

function saveChannelUrl(channelName) {
  var safeId = 'cu_' + channelName.replace(/[^a-zA-Z0-9_-]/g, '_');
  var input = document.getElementById(safeId);
  if (!input) return;
  var url = input.value.trim();
  api('/simulator/channel/' + encodeURIComponent(channelName) + '/url', {
    method: 'PUT',
    body: { sourceUrl: url }
  }).then(function(res) {
    if (res.code !== 1) { toast('保存失败', 'error'); return; }
    toast('通道 ' + channelName + ' 播放地址已保存');
  }).catch(function() { toast('保存失败', 'error'); });
}

function loadWindows() {
  api('/simulator/device/windows').then(function(res) {
    if (res.code !== 1) { document.getElementById('windowTableBody').innerHTML = '<tr><td colspan="7" class="empty-state">加载失败</td></tr>'; return; }
    var list = res.data || [];
    if (list.length === 0) { document.getElementById('windowTableBody').innerHTML = '<tr><td colspan="7" class="empty-state">暂无窗口（等待管控系统推送窗口快照）</td></tr>'; return; }
    var html = '';
    list.forEach(function(w) {
      html += '<tr>' +
        '<td style="font-family:monospace;font-size:12px">' + esc(w.windowId) + '</td>' +
        '<td>' + esc(w.channelName) + '</td>' +
        '<td>(' + (w.x||0) + ', ' + (w.y||0) + ')</td>' +
        '<td>' + (w.width||1920) + '×' + (w.height||1080) + '</td>' +
        '<td>' + esc(w.sourceType || '-') + '</td>' +
        '<td style="font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(w.sourceUrl || '-') + '</td>' +
        '<td style="font-size:12px">' + esc(w.createTime || '-') + '</td>' +
      '</tr>';
    });
    document.getElementById('windowTableBody').innerHTML = html;
  }).catch(function() { document.getElementById('windowTableBody').innerHTML = '<tr><td colspan="7" class="empty-state">加载失败</td></tr>'; });
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadDeviceInfo();
</script>

</body>
</html>
